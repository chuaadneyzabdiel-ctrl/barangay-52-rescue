name: rescue_app
description: "Integrated Rescue Operation Dispatch and Dynamic Relocation System for Caloocan City"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  provider: ^6.1.2
  uuid: ^4.5.1
  collection: ^1.19.1
  http: ^1.3.0
  firebase_core: ^3.12.1
  firebase_database: ^11.3.5
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.0
  flutter_map_tile_caching: 9.1.4
  flutter_tts: ^4.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
